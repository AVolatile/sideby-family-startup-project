<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-label="“Practice moved.”"><title>“Practice moved.”</title><style>@font-face{font-family:Manrope;src:url('/fonts/manrope-extra-bold.ttf')}text{font-family:Manrope,Arial,sans-serif}</style><rect width="1000" height="1500" fill="#c5dce8"/><g transform="translate(80 66.25) scale(1.2812499999999998)" fill="none" stroke="#241927" stroke-width="10" stroke-linecap="round"><path d="M11 9v17c0 8 5 13 13 13M37 39V22c0-8-5-13-13-13"/></g><text x="144.5" y="127.75" font-size="75" fill="#241927" font-weight="800" letter-spacing="-3.375">sideby.</text><text x="82" y="280" font-size="19" fill="#241927" font-weight="600" letter-spacing="0">EVERY FAMILY HAS THIS CONVERSATION.</text><text x="75" y="470" font-size="108" fill="#241927" font-weight="800" letter-spacing="-4.859999999999999">“Practice</text><text x="75" y="588.8" font-size="108" fill="#241927" font-weight="800" letter-spacing="-4.859999999999999">moved.”</text><g transform="translate(80 1050) scale(1.5)" fill="none" stroke="#241927" stroke-width="10" stroke-linecap="round"><path d="M11 9v17c0 8 5 13 13 13M37 39V22c0-8-5-13-13-13"/></g><text x="80" y="1190" font-size="32" fill="#241927" font-weight="800" letter-spacing="-1.44">The plan changed. Everyone knows.</text><text x="82" y="1390" font-size="20" fill="#241927" font-weight="600" letter-spacing="0">ROOM TO GROW. A PLAN TO GO.</text></svg>